<!doctype html>
<html lang="en"><head>
<link rel="stylesheet" href="../../tokens/tokens.css"><meta charset="utf-8"><title>ActivityTitleSlide</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap">
<style>
html,body{margin:0;background:#E9EAEC;overflow:hidden}
.cj-scale{width:1920px;height:1080px;transform-origin:0 0}
.cj-slide{position:relative;width:1920px;height:1080px;overflow:hidden}
.cj-slide>section{position:absolute;left:0;top:0;width:1920px;height:1080px;box-sizing:border-box}
.cj-slide *{margin:0;box-sizing:border-box}
.cj-slide div{display:flex;flex-direction:column}
</style></head>
<body><div class="cj-scale" id="s"><div class="cj-slide">
<section id="title" data-transition="fade" style="background:#FB3A3B;color:#FFFFFF;font-family:'Manrope', Arial, sans-serif;padding:0px">
<img src="../../assets/Logos/juniors-logo-white.png" alt="CODED Juniors logo" style="position:absolute;right:72px;top:44px;width:203px;height:80px;object-fit:contain">
<div style="position:absolute;left:120px;top:0px;width:980px;height:1080px;display:flex;flex-direction:column;justify-content:center;align-items:start;gap:36px">
<h2 style="font-size:150px;font-weight:800;line-height:1.0;letter-spacing:-2px;color:#FFFFFF">[Activity<br>Name]</h2>
<p style="font-size:64px;font-weight:800;line-height:1.2;color:#FFD15C">Day 1: [Day Name]</p>
</div>
<img src="../../assets/Decor/star-yellow-3d.png" alt="" style="position:absolute;left:1060px;top:210px;width:130px;height:124px;object-fit:contain;transform:rotate(-10deg)">
<img src="../../assets/Decor/sparkle-white.png" alt="" style="position:absolute;left:1100px;top:780px;width:70px;height:70px;object-fit:contain">
<img src="../../assets/Mascot/codey-hands-on-hips.png" alt="Codey with hands on hips" style="position:absolute;left:1240px;top:170px;width:520px;height:780px;object-fit:contain">
<div style="position:absolute;left:120px;right:120px;bottom:70px;height:2px;background:rgba(255,255,255,0.45)"></div>

</section>

</div></div>
<script>
function fit(){var k=Math.min(window.innerWidth/1920,1);var s=document.getElementById('s');s.style.transform='scale('+k+')';document.body.style.height=(1080*k)+'px';}
fit();window.addEventListener('resize',fit);
</script>
</body></html>
