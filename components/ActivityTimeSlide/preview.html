<!doctype html>
<html lang="en"><head>
<link rel="stylesheet" href="../../tokens/tokens.css"><meta charset="utf-8"><title>ActivityTimeSlide</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap">
<style>
html,body{margin:0;background:#E9EAEC;overflow:hidden}
.cj-scale{width:1920px;height:1080px;transform-origin:0 0}
.cj-slide{position:relative;width:1920px;height:1080px;overflow:hidden}
.cj-slide>section{position:absolute;left:0;top:0;width:1920px;height:1080px;box-sizing:border-box}
.cj-slide *{margin:0;box-sizing:border-box}
.cj-slide div{display:flex;flex-direction:column}
</style></head>
<body><div class="cj-scale" id="s"><div class="cj-slide">
<section id="activity" data-transition="fade" data-section="Build: activities, step screenshots, prompts, challenges, games and breaks" style="background:#FB3A3B;color:#FFFFFF;font-family:'Manrope', Arial, sans-serif;padding:0px">
<img src="../../assets/Logos/juniors-logo-white.png" alt="CODED Juniors logo" style="position:absolute;right:72px;top:44px;width:203px;height:80px;object-fit:contain">
<img src="../../assets/Decor/cloud-white-3d.png" alt="" style="position:absolute;left:0px;top:330px;width:360px;height:240px;object-fit:contain">
<img src="../../assets/Decor/cloud-white-3d.png" alt="" style="position:absolute;left:1560px;top:660px;width:300px;height:200px;object-fit:contain">
<img src="../../assets/Decor/star-yellow-3d.png" alt="" style="position:absolute;left:1480px;top:240px;width:150px;height:144px;object-fit:contain;transform:rotate(12deg)">
<img src="../../assets/Stickers/badge-super-coder-blue.png" alt="Super Coder badge" style="position:absolute;left:330px;top:720px;width:190px;height:190px;object-fit:contain;transform:rotate(-10deg)">
<div style="position:absolute;left:0px;top:0px;width:1920px;height:1080px;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:24px">
<h2 style="font-size:180px;font-weight:800;line-height:1.0;letter-spacing:-1px;color:#DCD3FF;text-align:center">Activity</h2>
<h2 style="font-size:180px;font-weight:800;line-height:1.02;letter-spacing:-1px;color:#FFFFFF;text-align:center">Time!</h2>
<p style="font-size:60px;font-weight:700;line-height:1.2;color:#FFD15C;text-align:center">[Activity Name]</p>
</div>
<div style="position:absolute;left:120px;right:120px;bottom:70px;height:2px;background:rgba(255,255,255,0.45)"></div>

</section>

</div></div>
<script>
function fit(){var k=Math.min(window.innerWidth/1920,1);var s=document.getElementById('s');s.style.transform='scale('+k+')';document.body.style.height=(1080*k)+'px';}
fit();window.addEventListener('resize',fit);
</script>
</body></html>
