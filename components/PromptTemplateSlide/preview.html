<!doctype html>
<html lang="en"><head>
<link rel="stylesheet" href="../../tokens/tokens.css"><meta charset="utf-8"><title>PromptTemplateSlide</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap">
<style>
html,body{margin:0;background:#E9EAEC;overflow:hidden}
.cj-scale{width:1920px;height:1080px;transform-origin:0 0}
.cj-slide{position:relative;width:1920px;height:1080px;overflow:hidden}
.cj-slide>section{position:absolute;left:0;top:0;width:1920px;height:1080px;box-sizing:border-box}
.cj-slide *{margin:0;box-sizing:border-box}
.cj-slide div{display:flex;flex-direction:column}
</style></head>
<body><div class="cj-scale" id="s"><div class="cj-slide">
<section id="prompt" data-transition="fade" style="background:#F6F6F6;color:#1A1A1A;font-family:'Manrope', Arial, sans-serif;padding:0px">
<img src="../../assets/Logos/juniors-logo-red.png" alt="CODED Juniors logo" style="position:absolute;right:72px;top:44px;width:203px;height:80px;object-fit:contain">
<h2 style="position:absolute;left:120px;top:150px;width:1680px;font-size:84px;font-weight:800;line-height:1.08;letter-spacing:0.5px">Let's Get <span style="color:#FB3A3B">Writing!</span></h2>
<div style="position:absolute;left:120px;top:290px;width:1060px;background:#FFFFFF;border-radius:36px;padding:56px;border:4px dashed #FB3A3B;box-shadow:0px 14px 36px rgba(20,36,63,0.10)">
<p style="font-size:44px;font-weight:700;line-height:1.45;color:#2A2F3A">Create a <span style="color:#FB3A3B">[WHAT]</span> in <span style="color:#2474BA">[STYLE]</span> style with <span style="color:#7C3AED">[COLOR]</span> colors. [Add the rules: shape, size, background, details.]</p>
</div>
<div style="position:absolute;left:1360px;top:290px;width:440px;height:640px;display:flex;flex-direction:column;justify-content:center;align-items:start;gap:36px">
<div style="display:flex;flex-direction:column;gap:20px">
<p style="font-size:36px;font-weight:800;line-height:1.1;color:#FFFFFF;background:#FB3A3B;padding:14px 36px;border-radius:999px">[WHAT]</p>
<p style="font-size:36px;font-weight:800;line-height:1.1;color:#FFFFFF;background:#2474BA;padding:14px 36px;border-radius:999px">[STYLE]</p>
<p style="font-size:36px;font-weight:800;line-height:1.1;color:#FFFFFF;background:#7C3AED;padding:14px 36px;border-radius:999px">[COLOR]</p>
</div>
<p style="font-size:48px;font-weight:800;line-height:1.25">Change only the coloured words!</p>
<p style="font-size:40px;font-weight:600;line-height:1.3;color:#5B6170">Copy the prompt from Google Classroom.</p>
</div>
<div style="position:absolute;left:120px;right:120px;bottom:70px;height:2px;background:#D5D8DD"></div>

</section>

</div></div>
<script>
function fit(){var k=Math.min(window.innerWidth/1920,1);var s=document.getElementById('s');s.style.transform='scale('+k+')';document.body.style.height=(1080*k)+'px';}
fit();window.addEventListener('resize',fit);
</script>
</body></html>
