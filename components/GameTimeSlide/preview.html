<!doctype html>
<html lang="en"><head>
<link rel="stylesheet" href="../../tokens/tokens.css"><meta charset="utf-8"><title>GameTimeSlide</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap">
<style>
html,body{margin:0;background:#E9EAEC;overflow:hidden}
.cj-scale{width:1920px;height:1080px;transform-origin:0 0}
.cj-slide{position:relative;width:1920px;height:1080px;overflow:hidden}
.cj-slide>section{position:absolute;left:0;top:0;width:1920px;height:1080px;box-sizing:border-box}
.cj-slide *{margin:0;box-sizing:border-box}
.cj-slide div{display:flex;flex-direction:column}
</style></head>
<body><div class="cj-scale" id="s"><div class="cj-slide">
<section id="game" data-transition="fade" style="background:#FB3A3B;color:#FFFFFF;font-family:'Manrope', Arial, sans-serif;padding:0px">
<div style="position:absolute;left:1060px;top:140px;width:800px;height:800px;border-radius:50%;background:radial-gradient(circle, rgba(255,255,255,0.30) 0%, rgba(255,255,255,0.08) 55%, rgba(255,255,255,0) 72%)"></div>
<img src="../../assets/Logos/juniors-logo-white.png" alt="CODED Juniors logo" style="position:absolute;right:72px;top:44px;width:203px;height:80px;object-fit:contain">
<div style="position:absolute;left:120px;top:0px;width:1000px;height:1080px;display:flex;flex-direction:column;justify-content:center;align-items:start;gap:36px">
<p style="font-size:34px;font-weight:800;letter-spacing:1px;color:#FB3A3B;background:#FFFFFF;padding:14px 34px;border-radius:999px">GAME TIME</p>
<h2 style="font-size:180px;font-weight:800;line-height:0.95;letter-spacing:-2px;color:#FFFFFF">[Blooket]!</h2>
<p style="font-size:60px;font-weight:800;line-height:1.2;color:#FFD15C">Open the website:</p>
<div style="display:flex;flex-direction:row;align-items:center;gap:26px;background:#FFFFFF;border-radius:999px;padding:20px 60px 20px 28px;box-shadow:0px 16px 36px rgba(0,0,0,0.25)">
<svg aria-label="" viewBox="0 0 24 24" width="84" height="84" style="flex:none" fill="none" stroke="#FB3A3B" stroke-width="2.25" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15 15 0 0 1 0 20M12 2a15 15 0 0 0 0 20"/></svg>
<p style="font-size:80px;font-weight:800;line-height:1;color:#1A1A1A;white-space:nowrap">[website]<span style="color:#FB3A3B">.com</span></p>
</div>
<p style="font-size:50px;font-weight:700;line-height:1.25;color:#FFFFFF">Answer as <span style="color:#FFD15C">fast</span> as you can!</p>
</div>
<img src="../../assets/Mascot/codey-jumping-cheer.png" alt="Codey jumping and cheering" style="position:absolute;left:1200px;top:210px;width:620px;height:620px;object-fit:contain">
<img src="../../assets/Decor/star-yellow-3d.png" alt="" style="position:absolute;left:1690px;top:170px;width:120px;height:115px;object-fit:contain;transform:rotate(12deg)">
<img src="../../assets/Decor/star-yellow-3d.png" alt="" style="position:absolute;left:1150px;top:720px;width:90px;height:86px;object-fit:contain;transform:rotate(-14deg)">
<div style="position:absolute;left:120px;right:120px;bottom:70px;height:2px;background:rgba(255,255,255,0.45)"></div>

</section>

</div></div>
<script>
function fit(){var k=Math.min(window.innerWidth/1920,1);var s=document.getElementById('s');s.style.transform='scale('+k+')';document.body.style.height=(1080*k)+'px';}
fit();window.addEventListener('resize',fit);
</script>
</body></html>
