<!doctype html>
<html lang="en"><head>
<link rel="stylesheet" href="../../tokens/tokens.css"><meta charset="utf-8"><title>FunFactSlide</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap">
<style>
html,body{margin:0;background:#E9EAEC;overflow:hidden}
.cj-scale{width:1920px;height:1080px;transform-origin:0 0}
.cj-slide{position:relative;width:1920px;height:1080px;overflow:hidden}
.cj-slide>section{position:absolute;left:0;top:0;width:1920px;height:1080px;box-sizing:border-box}
.cj-slide *{margin:0;box-sizing:border-box}
.cj-slide div{display:flex;flex-direction:column}
</style></head>
<body><div class="cj-scale" id="s"><div class="cj-slide">
<section id="funfact" data-transition="fade" style="background:#F6F6F6;color:#1A1A1A;font-family:'Manrope', Arial, sans-serif;padding:0px">
<div style="position:absolute;left:1075px;top:0px;width:845px;height:1080px;background:#FB3A3B"></div>
<img src="../../assets/Decor/sparkle-white.png" alt="" style="position:absolute;left:1770px;top:900px;width:60px;height:60px;object-fit:contain">
<img src="../../assets/Decor/sparkle-white.png" alt="" style="position:absolute;left:1165px;top:150px;width:48px;height:48px;object-fit:contain">
<div style="position:absolute;left:1075px;top:0px;width:845px;height:1080px;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:40px">
<h2 style="font-size:96px;font-weight:800;line-height:1.08;letter-spacing:0px;color:#FFFFFF;text-align:center;width:700px">FUN Fact!<br><span style="color:#FFD15C">Did you KNOW?</span></h2>
<img src="../../assets/Mascot/codey-idea-lightbulb.png" alt="Codey with a lightbulb idea" style="width:300px;height:450px;object-fit:contain">
</div>
<img src="../../assets/Logos/juniors-logo-red.png" alt="CODED Juniors logo" style="position:absolute;left:72px;top:44px;width:203px;height:80px;object-fit:contain">
<div style="position:absolute;left:120px;top:0px;width:835px;height:1080px;display:flex;flex-direction:column;justify-content:center;align-items:start;gap:44px">
<h2 style="font-size:84px;font-weight:800;line-height:1.22;letter-spacing:0.5px;color:#1A1A1A">[A surprising fact with a <span style="color:#FB3A3B">Wow</span> word]!</h2>
<p style="font-size:52px;font-weight:600;line-height:1.3;color:#5B6170">[One line that links the fact to <span style="color:#2474BA">today's activity</span>.]</p>
</div>
<div style="position:absolute;left:120px;right:965px;bottom:70px;height:2px;background:#D5D8DD"></div>

</section>

</div></div>
<script>
function fit(){var k=Math.min(window.innerWidth/1920,1);var s=document.getElementById('s');s.style.transform='scale('+k+')';document.body.style.height=(1080*k)+'px';}
fit();window.addEventListener('resize',fit);
</script>
</body></html>
