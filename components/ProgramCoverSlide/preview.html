<!doctype html>
<html lang="en"><head>
<link rel="stylesheet" href="../../tokens/tokens.css"><meta charset="utf-8"><title>ProgramCoverSlide</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap">
<style>
html,body{margin:0;background:#E9EAEC;overflow:hidden}
.cj-scale{width:1920px;height:1080px;transform-origin:0 0}
.cj-slide{position:relative;width:1920px;height:1080px;overflow:hidden}
.cj-slide>section{position:absolute;left:0;top:0;width:1920px;height:1080px;box-sizing:border-box}
.cj-slide *{margin:0;box-sizing:border-box}
.cj-slide div{display:flex;flex-direction:column}
</style></head>
<body><div class="cj-scale" id="s"><div class="cj-slide">

<div style="position:absolute;left:1000px;top:110px;width:900px;height:900px;border-radius:50%;background:radial-gradient(circle, rgba(255,255,255,0.30) 0%, rgba(255,255,255,0.08) 45%, rgba(255,255,255,0) 70%)"></div>

<div style="width:124px;height:140px;display:flex;flex-direction:column;gap:2px;align-items:center;justify-content:center;background:#C92A2B;border-radius:22px">
<p style="font-size:24px;font-weight:800;line-height:1;letter-spacing:2px;color:#FFD15C">[MON]</p>
<p style="font-size:62px;font-weight:800;line-height:1;color:#FFFFFF">00</p>
<p style="font-size:24px;font-weight:800;line-height:1;color:#FFFFFF">2026</p>
</div>
<div style="display:flex;flex-direction:column;gap:6px;align-items:start">

</div>
<div style="display:flex;flex-direction:row;gap:22px;align-items:center;padding:14px 34px 14px 14px;background:#FFFFFF;border-radius:30px;box-shadow:0px 14px 30px rgba(0,0,0,0.18);transform:rotate(2deg)">
<div style="width:124px;height:140px;display:flex;flex-direction:column;gap:2px;align-items:center;justify-content:center;background:#C92A2B;border-radius:22px">
<p style="font-size:24px;font-weight:800;line-height:1;letter-spacing:2px;color:#FFD15C">[MON]</p>
<p style="font-size:62px;font-weight:800;line-height:1;color:#FFFFFF">00</p>
<p style="font-size:24px;font-weight:800;line-height:1;color:#FFFFFF">2026</p>
</div>
<div style="display:flex;flex-direction:column;gap:6px;align-items:start">
<p style="font-size:26px;font-weight:800;line-height:1;letter-spacing:1.5px;color:#FB3A3B">DAY 2</p>
<p style="font-size:46px;font-weight:800;line-height:1.05;color:#1A1A1A">[Saturday]</p>
</div>
</div>
</div>
</div>
<img src="../../assets/Mascot/codey-laptop-front.png" alt="Codey with a laptop" style="position:absolute;left:1060px;top:220px;width:760px;height:760px;object-fit:contain">
<img src="../../assets/Decor/star-yellow-3d.png" alt="" style="position:absolute;left:900px;top:190px;width:110px;height:106px;object-fit:contain;transform:rotate(-12deg)">
<img src="../../assets/Decor/sparkle-white.png" alt="" style="position:absolute;left:1700px;top:200px;width:90px;height:90px;object-fit:contain">
<img src="../../assets/Decor/sparkle-white.png" alt="" style="position:absolute;left:1040px;top:760px;width:60px;height:60px;object-fit:contain">
<div style="position:absolute;left:120px;right:120px;bottom:70px;height:2px;background:rgba(255,255,255,0.45)"></div>

</section>

</div></div>
<script>
function fit(){var k=Math.min(window.innerWidth/1920,1);var s=document.getElementById('s');s.style.transform='scale('+k+')';document.body.style.height=(1080*k)+'px';}
fit();window.addEventListener('resize',fit);
</script>
</body></html>
