<!doctype html>
<html lang="en"><head>
<link rel="stylesheet" href="../../tokens/tokens.css"><meta charset="utf-8"><title>ThreeCardsSlide</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap">
<style>
html,body{margin:0;background:#E9EAEC;overflow:hidden}
.cj-scale{width:1920px;height:1080px;transform-origin:0 0}
.cj-slide{position:relative;width:1920px;height:1080px;overflow:hidden}
.cj-slide>section{position:absolute;left:0;top:0;width:1920px;height:1080px;box-sizing:border-box}
.cj-slide *{margin:0;box-sizing:border-box}
.cj-slide div{display:flex;flex-direction:column}
</style></head>
<body><div class="cj-scale" id="s"><div class="cj-slide">
<section id="threecards" data-transition="fade" style="background:#F6F6F6;color:#1A1A1A;font-family:'Manrope', Arial, sans-serif;padding:0px">
<img src="../../assets/Logos/juniors-logo-red.png" alt="CODED Juniors logo" style="position:absolute;right:72px;top:44px;width:203px;height:80px;object-fit:contain">
<h2 style="position:absolute;left:120px;top:150px;width:1680px;font-size:84px;font-weight:800;line-height:1.08;letter-spacing:0.5px">What is <span style="color:#FB3A3B">[Topic]</span>?</h2>
<div style="position:absolute;left:120px;top:270px;width:1680px;height:700px;display:flex;flex-direction:row;justify-content:center;align-items:center;gap:60px">
<div style="width:520px;background:#FFFFFF;border-radius:32px;padding:64px 48px;display:flex;flex-direction:column;align-items:center;gap:48px;box-shadow:0px 14px 36px rgba(20,36,63,0.10)">
<p style="width:130px;height:130px;border-radius:50%;background:#FB3A3B;color:#FFFFFF;font-size:64px;font-weight:800;line-height:130px;text-align:center">1</p>
<p style="font-size:54px;font-weight:700;line-height:1.25;text-align:center">[First <span style="color:#FB3A3B">Key</span> Point]</p>
</div>
<div style="width:520px;background:#FFFFFF;border-radius:32px;padding:64px 48px;display:flex;flex-direction:column;align-items:center;gap:48px;box-shadow:0px 14px 36px rgba(20,36,63,0.10)">
<p style="width:130px;height:130px;border-radius:50%;background:#2474BA;color:#FFFFFF;font-size:64px;font-weight:800;line-height:130px;text-align:center">2</p>
<p style="font-size:54px;font-weight:700;line-height:1.25;text-align:center">[Second <span style="color:#2474BA">Key</span> Point]</p>
</div>
<div style="width:520px;background:#FFFFFF;border-radius:32px;padding:64px 48px;display:flex;flex-direction:column;align-items:center;gap:48px;box-shadow:0px 14px 36px rgba(20,36,63,0.10)">
<p style="width:130px;height:130px;border-radius:50%;background:#E8890C;color:#FFFFFF;font-size:64px;font-weight:800;line-height:130px;text-align:center">3</p>
<p style="font-size:54px;font-weight:700;line-height:1.25;text-align:center">[Third <span style="color:#E8890C">Key</span> Point]</p>
</div>
</div>
<div style="position:absolute;left:120px;right:120px;bottom:70px;height:2px;background:#D5D8DD"></div>

</section>

</div></div>
<script>
function fit(){var k=Math.min(window.innerWidth/1920,1);var s=document.getElementById('s');s.style.transform='scale('+k+')';document.body.style.height=(1080*k)+'px';}
fit();window.addEventListener('resize',fit);
</script>
</body></html>
