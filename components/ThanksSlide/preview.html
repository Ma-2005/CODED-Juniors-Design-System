<!doctype html>
<html lang="en"><head>
<link rel="stylesheet" href="../../tokens/tokens.css"><meta charset="utf-8"><title>ThanksSlide</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap">
<style>
html,body{margin:0;background:#E9EAEC;overflow:hidden}
.cj-scale{width:1920px;height:1080px;transform-origin:0 0}
.cj-slide{position:relative;width:1920px;height:1080px;overflow:hidden}
.cj-slide>section{position:absolute;left:0;top:0;width:1920px;height:1080px;box-sizing:border-box}
.cj-slide *{margin:0;box-sizing:border-box}
.cj-slide div{display:flex;flex-direction:column}
</style></head>
<body><div class="cj-scale" id="s"><div class="cj-slide">
<section id="thanks" data-transition="fade" style="background:#FB3A3B;color:#FFFFFF;font-family:'Manrope', Arial, sans-serif;padding:0px">
<img src="../../assets/Logos/juniors-logo-white.png" alt="CODED Juniors logo" style="position:absolute;right:72px;top:44px;width:203px;height:80px;object-fit:contain">
<img src="../../assets/Decor/shooting-star-white-red.png" alt="" style="position:absolute;left:120px;top:470px;width:240px;height:156px;object-fit:contain">
<div style="position:absolute;left:0px;top:0px;width:1920px;height:1080px;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:28px">
<h2 style="font-size:190px;font-weight:800;line-height:1.0;letter-spacing:-1px;color:#FFFFFF;text-align:center">THANKS!</h2>
<p style="font-size:64px;font-weight:800;line-height:1.2;color:#FFD15C;text-align:center">Have Fun [Coding]!</p>
</div>
<img src="../../assets/Stickers/sticker-ibtikar-white-blue.png" alt="" style="position:absolute;left:300px;top:230px;width:300px;height:192px;object-fit:contain;transform:rotate(-8deg)">
<img src="../../assets/Stickers/sticker-barmaja-white-blue.png" alt="" style="position:absolute;left:1360px;top:230px;width:290px;height:180px;object-fit:contain;transform:rotate(6deg)">
<img src="../../assets/Stickers/tag-batal-yellow.png" alt="" style="position:absolute;left:1420px;top:790px;width:260px;height:102px;object-fit:contain;transform:rotate(-5deg)">
<img src="../../assets/Stickers/tag-batala-yellow.png" alt="" style="position:absolute;left:280px;top:770px;width:260px;height:102px;object-fit:contain;transform:rotate(5deg)">
<img src="../../assets/Stickers/tag-wanasa-blue.png" alt="" style="position:absolute;left:810px;top:820px;width:300px;height:124px;object-fit:contain;transform:rotate(-3deg)">
<img src="../../assets/Stickers/tag-ibdaa-yellow.png" alt="" style="position:absolute;left:1580px;top:520px;width:220px;height:89px;object-fit:contain;transform:rotate(4deg)">
<div style="position:absolute;left:120px;right:120px;bottom:70px;height:2px;background:rgba(255,255,255,0.45)"></div>

</section>

</div></div>
<script>
function fit(){var k=Math.min(window.innerWidth/1920,1);var s=document.getElementById('s');s.style.transform='scale('+k+')';document.body.style.height=(1080*k)+'px';}
fit();window.addEventListener('resize',fit);
</script>
</body></html>
