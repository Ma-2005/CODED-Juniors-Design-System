<!doctype html>
<html lang="en"><head>
<link rel="stylesheet" href="../../tokens/tokens.css"><meta charset="utf-8"><title>IceBreakerSlide</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap">
<style>
html,body{margin:0;background:#E9EAEC;overflow:hidden}
.cj-scale{width:1920px;height:1080px;transform-origin:0 0}
.cj-slide{position:relative;width:1920px;height:1080px;overflow:hidden}
.cj-slide>section{position:absolute;left:0;top:0;width:1920px;height:1080px;box-sizing:border-box}
.cj-slide *{margin:0;box-sizing:border-box}
.cj-slide div{display:flex;flex-direction:column}
</style></head>
<body><div class="cj-scale" id="s"><div class="cj-slide">
<section id="icebreaker" data-transition="fade" style="background:#FB3A3B;color:#FFFFFF;font-family:'Manrope', Arial, sans-serif;padding:0px">
<img src="../../assets/Logos/juniors-logo-white.png" alt="CODED Juniors logo" style="position:absolute;left:72px;top:44px;width:203px;height:80px;object-fit:contain">
<div style="position:absolute;left:120px;top:0px;width:920px;height:1080px;display:flex;flex-direction:column;justify-content:center;align-items:start;gap:40px">
<h2 style="font-size:150px;font-weight:800;line-height:1.05;letter-spacing:-1px;color:#FFFFFF">Ice Breaker!</h2>
<p style="font-size:76px;font-weight:800;line-height:1.2;color:#FFFFFF">[Game Name: <span style="color:#FFD15C">Spot the Difference</span>]</p>
<div style="display:flex;flex-direction:row;gap:28px">
<p style="font-size:40px;font-weight:800;line-height:1.1;color:#FB3A3B;background:#FFFFFF;padding:18px 40px;border-radius:999px">[How to answer]</p>
<p style="font-size:40px;font-weight:800;line-height:1.1;color:#FB3A3B;background:#FFFFFF;padding:18px 40px;border-radius:999px">[3 rounds]</p>
</div>
</div>
<div style="position:absolute;left:1110px;top:170px;width:700px;height:740px;border-radius:40px;overflow:hidden;box-shadow:0px 14px 36px rgba(20,36,63,0.18)">
<img src="../../assets/Mascot/codey-icebreaker-wall.png" alt="Codey bursting through a wall" style="width:700px;height:740px;object-fit:cover">
</div>
<div style="position:absolute;left:120px;right:120px;bottom:70px;height:2px;background:rgba(255,255,255,0.45)"></div>

</section>

</div></div>
<script>
function fit(){var k=Math.min(window.innerWidth/1920,1);var s=document.getElementById('s');s.style.transform='scale('+k+')';document.body.style.height=(1080*k)+'px';}
fit();window.addEventListener('resize',fit);
</script>
</body></html>
