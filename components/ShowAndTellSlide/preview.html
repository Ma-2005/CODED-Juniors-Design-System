<!doctype html>
<html lang="en"><head>
<link rel="stylesheet" href="../../tokens/tokens.css"><meta charset="utf-8"><title>ShowAndTellSlide</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap">
<style>
html,body{margin:0;background:#E9EAEC;overflow:hidden}
.cj-scale{width:1920px;height:1080px;transform-origin:0 0}
.cj-slide{position:relative;width:1920px;height:1080px;overflow:hidden}
.cj-slide>section{position:absolute;left:0;top:0;width:1920px;height:1080px;box-sizing:border-box}
.cj-slide *{margin:0;box-sizing:border-box}
.cj-slide div{display:flex;flex-direction:column}
</style></head>
<body><div class="cj-scale" id="s"><div class="cj-slide">
<section id="showtell" data-transition="fade" style="background:#F6F6F6;color:#1A1A1A;font-family:'Manrope', Arial, sans-serif;padding:0px">
<img src="../../assets/Logos/juniors-logo-red.png" alt="CODED Juniors logo" style="position:absolute;right:72px;top:44px;width:203px;height:80px;object-fit:contain">
<p style="position:absolute;left:120px;top:150px;font-size:30px;font-weight:800;color:#FFFFFF;background:#FB3A3B;padding:10px 28px;border-radius:999px;letter-spacing:1px">YOUR TURN</p>
<h2 style="position:absolute;left:120px;top:226px;width:1680px;font-size:84px;font-weight:800;line-height:1.08;letter-spacing:0.5px">Show &amp; <span style="color:#FB3A3B">Tell!</span></h2>
<div style="position:absolute;left:120px;top:330px;width:1160px;height:630px;display:flex;flex-direction:column;justify-content:center;align-items:start;gap:40px">
<div style="width:1080px;background:#FFFFFF;border-radius:32px;padding:64px;display:flex;flex-direction:column;align-items:start;gap:24px;box-shadow:0px 14px 36px rgba(20,36,63,0.10)">
<p style="font-size:68px;font-weight:800;line-height:1.4">"This is my <span style="color:#FB3A3B">____</span>. I made it <span style="color:#2474BA">____</span> because <span style="color:#E8890C">____</span>!"</p>
</div>
<p style="font-size:50px;font-weight:700;line-height:1.2;color:#5B6170">[Show your project on the screen while you talk!]</p>
</div>
<img src="../../assets/Mascot/codey-hello-bubble.png" alt="Codey saying hello" style="position:absolute;left:1300px;top:300px;width:560px;height:560px;object-fit:contain">
<div style="position:absolute;left:120px;right:120px;bottom:70px;height:2px;background:#D5D8DD"></div>

</section>

</div></div>
<script>
function fit(){var k=Math.min(window.innerWidth/1920,1);var s=document.getElementById('s');s.style.transform='scale('+k+')';document.body.style.height=(1080*k)+'px';}
fit();window.addEventListener('resize',fit);
</script>
</body></html>
