<!doctype html>
<html lang="en"><head>
<link rel="stylesheet" href="../../tokens/tokens.css"><meta charset="utf-8"><title>ToolRevealSlide</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap">
<style>
html,body{margin:0;background:#E9EAEC;overflow:hidden}
.cj-scale{width:1920px;height:1080px;transform-origin:0 0}
.cj-slide{position:relative;width:1920px;height:1080px;overflow:hidden}
.cj-slide>section{position:absolute;left:0;top:0;width:1920px;height:1080px;box-sizing:border-box}
.cj-slide *{margin:0;box-sizing:border-box}
.cj-slide div{display:flex;flex-direction:column}
</style></head>
<body><div class="cj-scale" id="s"><div class="cj-slide">
<section id="tool" data-transition="fade" style="background:#FB3A3B;color:#FFFFFF;font-family:'Manrope', Arial, sans-serif;padding:0px">
<div style="position:absolute;left:1075px;top:0px;width:845px;height:1080px;background:#F6F6F6"></div>
<img src="../../assets/Logos/juniors-logo-red.png" alt="CODED Juniors logo" style="position:absolute;right:72px;top:44px;width:203px;height:80px;object-fit:contain">
<div style="position:absolute;left:120px;top:0px;width:860px;height:1080px;display:flex;flex-direction:column;justify-content:center;align-items:start;gap:36px">
<p style="font-size:56px;font-weight:800;line-height:1.2;color:#FFFFFF">Using…</p>
<h2 style="font-size:130px;font-weight:800;line-height:1.05;letter-spacing:0.5px;color:#FFFFFF">[Tool<br>Name]!</h2>
<p style="font-size:48px;font-weight:700;line-height:1.25;color:#FFD15C">[Our AI picture maker]</p>
</div>
<div style="position:absolute;left:1257px;top:300px;width:480px;height:480px;border-radius:40px;background:#FFFFFF;border:4px dashed #C9CDD4;display:flex;align-items:center;justify-content:center">
<p style="font-size:36px;font-weight:700;color:#8A8F98;text-align:center;width:380px">[ Tool logo ]</p>
</div>
<img src="../../assets/Decor/sparkle-white.png" alt="" style="position:absolute;left:900px;top:220px;width:80px;height:80px;object-fit:contain">
<div style="position:absolute;left:120px;right:965px;bottom:70px;height:2px;background:rgba(255,255,255,0.45)"></div>

</section>

</div></div>
<script>
function fit(){var k=Math.min(window.innerWidth/1920,1);var s=document.getElementById('s');s.style.transform='scale('+k+')';document.body.style.height=(1080*k)+'px';}
fit();window.addEventListener('resize',fit);
</script>
</body></html>
