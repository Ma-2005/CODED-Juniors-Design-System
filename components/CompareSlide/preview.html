<!doctype html>
<html lang="en"><head>
<link rel="stylesheet" href="../../tokens/tokens.css"><meta charset="utf-8"><title>CompareSlide</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap">
<style>
html,body{margin:0;background:#E9EAEC;overflow:hidden}
.cj-scale{width:1920px;height:1080px;transform-origin:0 0}
.cj-slide{position:relative;width:1920px;height:1080px;overflow:hidden}
.cj-slide>section{position:absolute;left:0;top:0;width:1920px;height:1080px;box-sizing:border-box}
.cj-slide *{margin:0;box-sizing:border-box}
.cj-slide div{display:flex;flex-direction:column}
</style></head>
<body><div class="cj-scale" id="s"><div class="cj-slide">
<section id="compare" data-transition="fade" style="background:#F6F6F6;color:#1A1A1A;font-family:'Manrope', Arial, sans-serif;padding:0px">
<img src="../../assets/Logos/juniors-logo-red.png" alt="CODED Juniors logo" style="position:absolute;right:72px;top:44px;width:203px;height:80px;object-fit:contain">
<h2 style="position:absolute;left:120px;top:150px;width:1680px;font-size:84px;font-weight:800;line-height:1.08;letter-spacing:0.5px">What is a <span style="color:#FB3A3B">[Prompt]</span>?</h2>
<p style="position:absolute;left:120px;top:258px;width:1680px;font-size:40px;font-weight:700;line-height:1.2;color:#5B6170">[One-line meaning.] <span style="color:#FB3A3B">Clear + Detailed = Great Result!</span></p>
<div style="position:absolute;left:120px;top:340px;width:1680px;height:630px;display:flex;flex-direction:row;justify-content:center;align-items:center;gap:80px">
<div style="width:760px;background:#FFFFFF;border-radius:32px;padding:32px;display:flex;flex-direction:column;align-items:center;gap:20px;box-shadow:0px 14px 36px rgba(20,36,63,0.10)">
<p style="font-size:34px;font-weight:800;color:#FFFFFF;background:#8A8F98;padding:8px 32px;border-radius:999px">Weak</p>
<p style="font-size:36px;font-weight:700;line-height:1.3;text-align:center;width:680px">"[Make a robot]"</p>
<div style="width:380px;height:340px;border-radius:24px;background:#ECEEF2;display:flex;align-items:center;justify-content:center"><p style="font-size:32px;font-weight:700;color:#8A8F98;text-align:center;width:300px">[ Weak result ]</p></div>
</div>
<div style="width:760px;background:#FFFFFF;border-radius:32px;padding:32px;display:flex;flex-direction:column;align-items:center;gap:20px;box-shadow:0px 14px 36px rgba(20,36,63,0.10)">
<p style="font-size:34px;font-weight:800;color:#FFFFFF;background:#16A34A;padding:8px 32px;border-radius:999px">Strong</p>
<p style="font-size:36px;font-weight:700;line-height:1.3;text-align:center;width:680px">"[A happy robot with silver arms in a candy world]"</p>
<div style="width:380px;height:340px;border-radius:24px;background:#ECEEF2;display:flex;align-items:center;justify-content:center"><p style="font-size:32px;font-weight:700;color:#8A8F98;text-align:center;width:300px">[ Strong result ]</p></div>
</div>
</div>
<div style="position:absolute;left:120px;right:120px;bottom:70px;height:2px;background:#D5D8DD"></div>

</section>

</div></div>
<script>
function fit(){var k=Math.min(window.innerWidth/1920,1);var s=document.getElementById('s');s.style.transform='scale('+k+')';document.body.style.height=(1080*k)+'px';}
fit();window.addEventListener('resize',fit);
</script>
</body></html>
